<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Complementary Colors Creator</title>
<meta name="description" content="Build complementary color palettes from a HEX code, a color picker or a photo. By nuforms lab.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23CCFF00'/%3E%3Ctext x='42' y='76' text-anchor='middle' font-family='Helvetica Neue,Arial,sans-serif' font-weight='800' font-size='74' letter-spacing='-2' fill='%23111'%3EC%3C/text%3E%3Ctext x='80' y='42' text-anchor='middle' font-family='Helvetica Neue,Arial,sans-serif' font-weight='800' font-size='34' fill='%23111'%3E3%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23CCFF00'/%3E%3Ctext x='42' y='76' text-anchor='middle' font-family='Helvetica Neue,Arial,sans-serif' font-weight='800' font-size='74' letter-spacing='-2' fill='%23111'%3EC%3C/text%3E%3Ctext x='80' y='42' text-anchor='middle' font-family='Helvetica Neue,Arial,sans-serif' font-weight='800' font-size='34' fill='%23111'%3E3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: one quiet room — brand top-left, a three-way input switch, then the palette as overlapping capsules. */
:root{
  --h: 42;                       /* hue of the current base color, set by JS */
  --brand-l: #8A3A1E;            /* brand ink for light ground, set by JS */
  --brand-d: #F0C27A;            /* brand ink for dark ground, set by JS */
  --bg: hsl(var(--h) 48% 87%);
  --ink: hsl(var(--h) 25% 14%);
  --muted: hsl(var(--h) 14% 38%);
  --line: hsl(var(--h) 25% 72%);
  --field: hsl(var(--h) 50% 92%);
  --brand: var(--brand-l);
  --btn: hsl(var(--h) 32% 30%);
  --btn-hover: hsl(var(--h) 34% 24%);
  --btn-ink: hsl(var(--h) 48% 92%);
  --display: 'Syne', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Space Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: hsl(var(--h) 16% 8%);
    --ink: hsl(var(--h) 20% 90%);
    --muted: hsl(var(--h) 10% 62%);
    --line: hsl(var(--h) 12% 24%);
    --field: hsl(var(--h) 14% 12%);
    --brand: var(--brand-d);
    --btn: hsl(var(--h) 22% 26%);
    --btn-hover: hsl(var(--h) 24% 32%);
    --btn-ink: hsl(var(--h) 40% 88%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg: hsl(var(--h) 16% 8%);
  --ink: hsl(var(--h) 20% 90%);
  --muted: hsl(var(--h) 10% 62%);
  --line: hsl(var(--h) 12% 24%);
  --field: hsl(var(--h) 14% 12%);
  --brand: var(--brand-d);
  --btn: hsl(var(--h) 22% 26%);
  --btn-hover: hsl(var(--h) 24% 32%);
  --btn-ink: hsl(var(--h) 40% 88%);
  color-scheme: dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--bg); color:var(--ink);
  font-family:var(--mono); font-size:13px;
  padding-inline:clamp(16px,4vw,64px); padding-block:28px 22px;
  transition:background-color .8s ease;
}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;color:var(--brand);transition:color .8s ease}
.brand-mark{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;letter-spacing:-.04em}
.brand-mark sup{font-size:.42em;vertical-align:top;position:relative;top:-.08em;margin-left:.04em;letter-spacing:0}
.brand-name{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.theme-btn{
  font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:6px 12px;cursor:pointer;
}
.theme-btn:hover{color:var(--ink)}

/* Mode switch */
.modes{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:56px}
.modes .sep{width:1px;height:14px;background:var(--line)}
.mode{
  font-family:var(--mono);font-size:13px;letter-spacing:.06em;
  background:none;border:0;padding:4px 2px;cursor:pointer;color:var(--muted);
  border-bottom:1px solid transparent;
}
.mode:hover{color:var(--ink)}
.mode[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
button:focus,label:focus,.drop:focus{outline:none}
body.kbd button:focus-visible,body.kbd label:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Input panels — fixed height so the stage never jumps */
.panels{height:136px;display:grid;place-items:center;margin-top:14px}
.panel{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}

.code-field{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--field);
  border-radius:999px;padding:10px 10px 10px 18px;
}
.code-field span{color:var(--muted);font-size:16px}
#hexInput{
  font-family:var(--mono);font-size:16px;letter-spacing:.08em;text-transform:uppercase;
  width:7.5ch;border:0;background:transparent;color:var(--ink);outline:none;
}
.chip{width:22px;height:22px;border-radius:50%;background:var(--accent,#EBC05A);border:1px solid rgba(0,0,0,.12)}
.go{
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  border:0;border-radius:999px;padding:9px 16px;cursor:pointer;
  background:var(--btn);color:var(--btn-ink);
  transition:background-color .3s ease;
}
.go:hover{background:var(--btn-hover)}

.drop{
  display:flex;align-items:center;gap:14px;cursor:pointer;
  border:1px solid var(--line);background:var(--field);border-radius:999px;
  padding:10px 22px 10px 10px;color:var(--muted);transition:border-color .2s;
}
.drop.over{border-color:var(--ink);color:var(--ink)}
.drop .thumb{width:40px;height:40px;border-radius:50%;background:var(--line) center/cover;flex:none}
.drop b{color:var(--ink);font-weight:400}

.picker{display:flex;flex-direction:column;gap:10px;width:300px;max-width:100%}
#sv{width:100%;height:92px;border-radius:14px;cursor:crosshair;display:block;touch-action:none}
#hue{
  -webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;outline:none;
  background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.4);cursor:pointer}
#hue::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.4);cursor:pointer}

/* Accordion state + rail */
.label{transition:opacity .35s ease}
.stage.focusing .pill .label{opacity:.38}
.stage.focusing .pill.on .label{opacity:1}
.pill.on{box-shadow:0 22px 50px -14px rgba(20,8,0,.45)}

.flyer{position:fixed;z-index:500;border-radius:50%;pointer-events:none;box-shadow:0 10px 30px -8px rgba(0,0,0,.4)}
.code-field.landed{animation:landed .5s cubic-bezier(.2,.8,.2,1)}
@keyframes landed{0%{box-shadow:0 0 0 0 var(--accent)}40%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}

/* Reference weights */
.weights{width:100%;max-width:1180px;margin:72px auto 0;display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:40px;align-items:center}
.weights[hidden]{display:none}
.ref{display:flex;flex-direction:column;gap:10px;min-width:0}
.ref-img{width:100%;aspect-ratio:4/5;border-radius:18px;background:var(--line) center/cover;max-width:100%}
.ref-cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field{position:relative;height:380px;min-width:0}
.orb{position:absolute;border-radius:50%;cursor:pointer;-webkit-user-select:none;user-select:none;
  box-shadow:0 18px 36px -16px rgba(20,8,0,.45);
  animation:levitate var(--dur,7s) ease-in-out var(--delay,0s) infinite alternate;
  transition:box-shadow .3s}
.orb:hover{box-shadow:0 24px 44px -14px rgba(20,8,0,.55)}
.orb:focus{outline:none}
body.kbd .orb:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.orb{display:grid;place-items:center}
.orb-tag{display:flex;flex-direction:column;align-items:center;gap:.25em;text-align:center;pointer-events:none;
  font-variant-numeric:tabular-nums;line-height:1}
.orb-tag b{font-family:var(--display);font-weight:700;letter-spacing:-.02em}
.orb-tag span{font-size:10px;letter-spacing:.08em;opacity:.78}
@keyframes levitate{
  0%{translate:0 calc(var(--amp,8px) * -1)}
  50%{translate:var(--sway,3px) 0}
  100%{translate:0 var(--amp,8px)}
}
@media (max-width:640px){
  .weights{grid-template-columns:1fr;gap:20px;margin-top:48px}
  .ref{flex-direction:row;align-items:center}
  .ref-img{width:72px;aspect-ratio:1;border-radius:12px;flex:none}
  .field{height:300px}
}

/* Site footer */
.site-foot{display:flex;justify-content:flex-end;align-items:baseline;gap:10px;margin-top:auto;padding-top:72px;
  font-size:11px;letter-spacing:.06em;color:var(--muted)}
.site-foot .sep{opacity:.5}
.site-foot sup{font-size:.7em;line-height:0}
.lab-name{color:var(--ink)}
@media (max-width:640px){.site-foot{justify-content:center;padding-top:56px}}

/* Harmony row */
.harmonies{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;margin-top:4px}
.harm-rule{margin:8px 0 0;text-align:center;font-size:10px;letter-spacing:.08em;color:var(--muted);min-height:1.4em}
.harm{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:0;padding:4px 0;cursor:pointer;color:var(--muted);
}
.harm:hover{color:var(--ink)}
.harm[aria-pressed="true"]{color:var(--ink)}
.harm[aria-pressed="true"]::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent,#EBC05A);margin-right:7px;vertical-align:1px;box-shadow:0 0 0 1px var(--line)}

/* Stage of capsules */
.stage{position:relative;margin:24px auto 0;max-width:1180px;width:100%}
.pill{
  position:absolute;border-radius:9999px;cursor:pointer;
  box-shadow:16px 0 34px -10px rgba(20,8,0,.35);
  transform-origin:50% 100%;will-change:transform;
  transition:background-color .7s cubic-bezier(.2,.7,.2,1),left .5s,top .5s,width .5s,height .5s;
  animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
}
.stage.vertical .pill{box-shadow:0 16px 30px -10px rgba(20,8,0,.35)}
.pill{transform-origin:50% 50%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.pill:focus{outline:none}
body.kbd .pill:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.stage.vertical .pill{transform-origin:50% 50%}
@keyframes rise{from{translate:0 40px;opacity:0}to{translate:0 0;opacity:1}}

.label{
  position:absolute;display:flex;flex-direction:column;gap:4px;
  font-size:11px;line-height:1.35;pointer-events:none;
  font-variant-numeric:tabular-nums;
}
.label .hex{font-size:14px;font-weight:700;letter-spacing:.04em}
.label .name{opacity:.82}
.label .base{
  align-self:flex-start;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid currentColor;border-radius:999px;padding:1px 6px;margin-bottom:4px;opacity:.85;
}
.stage.vertical .label{flex-direction:row;flex-wrap:wrap;align-items:baseline;column-gap:14px}
.stage.vertical .label .base{margin:0}

.foot{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 22px;margin-top:44px;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.foot button{font:inherit;background:none;border:0;color:inherit;cursor:pointer;letter-spacing:inherit;text-transform:inherit;padding:0}
.foot button:hover{color:var(--ink)}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:12px;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Canvas — a Bauhaus test sheet: the chosen colors at work on paper */
/* the Canvas tab is its own page: the input panels, capsules, export row and photo weights step aside */
body:not(.canvas-view) .canvas-lab,
body.canvas-view .panels,body.canvas-view .stage,body.canvas-view .foot,body.canvas-view .weights{display:none!important}
.modes .sep.wide{margin-inline:4px}
.canvas-lab{width:100%;max-width:1180px;margin:28px auto 0}
.cv-grid{display:grid;grid-template-columns:minmax(0,40%) minmax(0,340px);justify-content:center;align-items:start;gap:clamp(28px,5vw,72px);margin-top:32px}
.cv-art{min-width:0;display:flex;justify-content:center}
.cv-art svg{display:block;max-width:100%;height:auto;box-shadow:0 30px 60px -30px rgba(20,8,0,.5)}
.cv-panel{display:flex;flex-direction:column;gap:24px;min-width:0}
.cv-group{display:flex;flex-direction:column;gap:10px}
.cv-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cv-chips{display:flex;flex-wrap:wrap;gap:9px}
.cv-chip{width:28px;height:28px;border-radius:50%;padding:0;cursor:pointer;border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);transition:box-shadow .2s}
.cv-chip.sm{width:22px;height:22px}
.cv-chip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.cv-rows{display:flex;flex-direction:column;gap:6px}
.cv-row{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:5px 4px 5px 6px}
.cv-sw{width:24px;height:24px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.12)}
.cv-hash{color:var(--muted);font-size:14px;margin-left:8px}
.cv-hex{flex:1;min-width:0;font-family:var(--mono);font-size:14px;letter-spacing:.08em;text-transform:uppercase;border:0;background:transparent;color:var(--ink);outline:none}
.cv-x{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:18px;line-height:1;padding:2px 10px}
.cv-x:hover{color:var(--ink)}
.cv-seg{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cv-seg button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;transition:background-color .2s,color .2s}
.cv-seg button:hover{color:var(--ink)}
.cv-seg button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.cv-seg .gap{width:10px}
.cv-field{width:100%;font-family:var(--mono);font-size:14px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:10px 16px;outline:none}
.cv-field::placeholder{color:var(--muted)}
.cv-select{position:relative}
.cv-select select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:38px}
.cv-select::after{content:'▾';position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
select:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.cv-actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.cv-link{font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;color:var(--muted);cursor:pointer;padding:0}
.cv-link:hover{color:var(--ink)}

@media (max-width:640px){
  .modes{margin-top:36px}
  .brand-mark{font-size:36px}
  .cv-grid{grid-template-columns:minmax(0,1fr);gap:28px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
  <div class="brand" aria-label="C cubed, Complementary Colors Creator">
    <div class="brand-mark" aria-hidden="true">C<sup>3</sup></div>
    <span class="brand-name">Complementary Colors Creator</span>
  </div>
  <button class="theme-btn" id="themeBtn" type="button">Dark</button>
</header>

<nav class="modes" role="tablist" aria-label="Set the base color or open the canvas">
  <button class="mode" role="tab" id="tab-upload" data-mode="upload" aria-selected="false">Upload</button>
  <span class="sep"></span>
  <button class="mode" role="tab" id="tab-code" data-mode="code" aria-selected="true">Code</button>
  <span class="sep"></span>
  <button class="mode" role="tab" id="tab-picker" data-mode="picker" aria-selected="false">Picker</button>
  <span class="sep wide"></span>
  <button class="mode" role="tab" id="tab-canvas" data-mode="canvas" aria-selected="false">Canvas</button>
</nav>

<div class="panels">
  <div class="panel" id="panel-code">
    <div class="code-field">
      <span>#</span>
      <input id="hexInput" maxlength="7" value="EBC05A" spellcheck="false" autocomplete="off" aria-label="HEX color">
      <div class="chip" aria-hidden="true"></div>
    </div>
    <button class="go" id="goBtn" type="button">Generate</button>
  </div>

  <div class="panel" id="panel-upload" hidden>
    <label class="drop" id="drop" for="fileInput" tabindex="0">
      <span class="thumb" id="thumb"></span>
      <span><b>Drop a photo</b> or click to choose</span>
    </label>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <div class="panel" id="panel-picker" hidden>
    <div class="picker">
      <canvas id="sv" width="600" height="184" aria-label="Saturation and brightness"></canvas>
      <input type="range" id="hue" min="0" max="359" value="42" aria-label="Hue">
    </div>
  </div>
</div>

<nav class="harmonies" id="harmonies" aria-label="Harmony"></nav>
<p class="harm-rule" id="harmRule" aria-live="polite"></p>

<section class="stage" id="stage" aria-label="Generated palette"></section>

<div class="foot">
  <button type="button" id="copySvg">Copy SVG</button>
  <button type="button" id="copyCss">Copy CSS</button>
  <button type="button" id="copyJson">Copy JSON</button>
</div>

<section class="weights" id="weights" hidden aria-label="Color weight of the reference photo">
  <div class="ref">
    <div class="ref-img" id="refImg"></div>
    <span class="ref-cap">Reference · color weight</span>
  </div>
  <div class="field" id="field"></div>
</section>

<section class="canvas-lab" id="canvasLab" aria-label="Canvas · your colors at work on a poster">
  <div class="cv-grid">
    <div class="cv-art" id="cvArt" role="img" aria-label="Poster made of the chosen colors"></div>
    <div class="cv-panel">
      <div class="cv-group">
        <span class="cv-label">Style</span>
        <div class="cv-seg" id="cvStyle">
          <button type="button" data-style="circular" aria-pressed="true" title="Capsules, circles and dots">Circular</button>
          <button type="button" data-style="construct" aria-pressed="false" title="A diagonal, a sun, bars and a rule">Construct</button>
        </div>
      </div>
      <div class="cv-group">
        <span class="cv-label" id="cvPickLabel">Colors · pick 2–4 from the palette</span>
        <div class="cv-chips" id="cvChips" role="group" aria-labelledby="cvPickLabel"></div>
        <div class="cv-rows" id="cvRows"></div>
      </div>
      <div class="cv-group">
        <span class="cv-label">Paper · ink</span>
        <div class="cv-seg" id="cvPaper">
          <button type="button" data-paper="cream" aria-pressed="true">Cream</button>
          <button type="button" data-paper="white" aria-pressed="false">White</button>
          <span class="gap" aria-hidden="true"></span>
          <button type="button" id="cvInk" aria-pressed="true" title="Use black as a neutral">Ink</button>
        </div>
      </div>
      <div class="cv-group">
        <span class="cv-label">Format</span>
        <div class="cv-seg" id="cvFormat">
          <button type="button" data-f="3:4" aria-pressed="true">Poster 3:4</button>
          <button type="button" data-f="1:1" aria-pressed="false">Square</button>
          <button type="button" data-f="9:16" aria-pressed="false">Story 9:16</button>
          <button type="button" data-f="16:9" aria-pressed="false">Banner 16:9</button>
        </div>
      </div>
      <div class="cv-group">
        <label class="cv-label" for="cvText">Text</label>
        <input class="cv-field" id="cvText" maxlength="48" placeholder="Brand name or slogan" autocomplete="off" spellcheck="false">
        <div class="cv-select"><select class="cv-field" id="cvFont" aria-label="Font"></select></div>

          <button type="button" data-place="band" aria-pressed="true" title="Text on a strip of paper under the shapes">On paper</button>
          <button type="button" data-place="over" aria-pressed="false" title="Text over the shapes">Over shapes</button>
        </div>

<div class="toast" id="toast"></div>

<script>
/* ---------- color math ---------- */
function hexToRgb(hex){hex=hex.replace('#','');return{r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)}}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase()}
function hexToHSL(hex){
  let{r,g,b}=hexToRgb(hex);r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);let h=0,s=0;const l=(max+min)/2;
  if(max!==min){const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);
    h=max===r?(g-b)/d+(g<b?6:0):max===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return{h,s:s*100,l:l*100};
}
function hslToHex(h,s,l){
  h=((h%360)+360)%360;s/=100;l/=100;
  const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return rgbToHex(f(0)*255,f(8)*255,f(4)*255);
}
function hsvToHex(h,s,v){const l=v*(1-s/2);const sl=(l===0||l===1)?0:(v-l)/Math.min(l,1-l);return hslToHex(h,sl*100,l*100)}
function luminance(hex){const{r,g,b}=hexToRgb(hex);const c=[r,g,b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function toLab(hex){
  const{r,g,b}=hexToRgb(hex);
  const lin=[r,g,b].map(v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  const x=(lin[0]*.4124+lin[1]*.3576+lin[2]*.1805)/.95047,y=lin[0]*.2126+lin[1]*.7152+lin[2]*.0722,z=(lin[0]*.0193+lin[1]*.1192+lin[2]*.9505)/1.08883;
  const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;
  return[116*f(y)-16,500*(f(x)-f(y)),200*(f(y)-f(z))];
}
function dE(a,b){const A=toLab(a),B=toLab(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2])}

/* ---------- names ---------- */
// Pantone Colors of the Year (TCX), shown only when a swatch is a close match.
const PANTONE=[
  ['15-4020','Cerulean','#9BB7D4'],['17-2031','Fuchsia Rose','#C74375'],['19-1664','True Red','#BF1932'],
  ['14-4811','Aqua Sky','#7BC4C4'],['17-1456','Tigerlily','#E2583E'],['15-5217','Blue Turquoise','#53B0AE'],
  ['13-1106','Sand Dollar','#DECDBE'],['19-1557','Chili Pepper','#9B1B30'],['18-3943','Blue Iris','#5A5B9F'],
  ['14-0848','Mimosa','#F0C05A'],['15-5519','Turquoise','#45B5AA'],['18-2120','Honeysuckle','#D94F70'],
  ['17-1463','Tangerine Tango','#DD4124'],['17-5641','Emerald','#009473'],['18-3224','Radiant Orchid','#B163A3'],
  ['18-1438','Marsala','#955251'],['13-1520','Rose Quartz','#F7CAC9'],['15-3919','Serenity','#92A8D1'],
  ['15-0343','Greenery','#88B04B'],['18-3838','Ultra Violet','#5F4B8B'],['16-1546','Living Coral','#FF6F61'],
  ['19-4052','Classic Blue','#0F4C81'],['13-0647','Illuminating','#F5DF4D'],['17-5104','Ultimate Gray','#939597'],
  ['17-3938','Very Peri','#6667AB'],['18-1750','Viva Magenta','#BB2649'],['13-1023','Peach Fuzz','#FFBE98'],
  ['17-1230','Mocha Mousse','#A47864']
];
const NAMES=[
  ['Ivory','#FFFFF0'],['Bone','#E3DCCB'],['Cream','#F3E5C0'],['Sand','#D8C3A0'],['Wheat','#E9C98B'],['Butter','#F3D46B'],
  ['Saffron','#EBB43A'],['Mustard','#D9A62E'],['Ochre','#CC7722'],['Apricot','#F2A66B'],['Peach','#F7B89A'],['Coral','#F27B67'],
  ['Tangerine','#EE7F2D'],['Terracotta','#C8603E'],['Sienna','#A0522D'],['Rust','#B7410E'],['Brick','#A23A2A'],['Vermilion','#D83A24'],
  ['Crimson','#B0182C'],['Oxblood','#5B1A1A'],['Burgundy','#6E1E2D'],['Wine','#4E1A22'],['Plum','#6B2D5C'],['Mauve','#B07A9A'],
  ['Blush','#E8B4B8'],['Rose','#D96C86'],['Magenta','#B8336A'],['Lilac','#C4A9D8'],['Lavender','#A99BD6'],['Violet','#6A4BA0'],
  ['Indigo','#3B3A7A'],['Navy','#1E2A4A'],['Cobalt','#1F4FA0'],['Azure','#3A8FD8'],['Sky','#A7CCE8'],['Teal','#1F7A7A'],
  ['Aqua','#7BCFC8'],['Mint','#A8DCC0'],['Sage','#9CAF88'],['Olive','#707A3A'],['Moss','#5A6B2F'],['Forest','#21462E'],
  ['Jade','#1E8A5A'],['Chartreuse','#B5D334'],['Lime','#C8E06A'],['Charcoal','#2E2E30'],['Graphite','#4A4B4F'],['Slate','#6A7682'],
  ['Stone','#A8A196'],['Espresso','#3A2620'],['Cocoa','#6B4432'],['Umber','#7A4B2A'],['Tan','#C9A27A'],['Ink','#14161C']
];
function describe(hex){
  let best=null,bd=1e9;
  for(const p of PANTONE){const d=dE(hex,p[2]);if(d<bd){bd=d;best=p}}
  if(bd<9) return{pantone:'PANTONE '+best[0],name:best[1]};
  let n=NAMES[0],nd=1e9;for(const c of NAMES){const d=dE(hex,c[1]);if(d<nd){nd=d;n=c}}
  return{pantone:null,name:n[0]};
}

/* ---------- palette engine v2: perceptual OKLCH colour wheel ---------- */
// OKLCH: L = perceived lightness (0..1), C = chroma (colourfulness), H = hue angle.
// Equal L looks equally light to the eye, unlike HSL where yellow glows and blue sinks.
function srgbToLin(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)}
function linToSrgb(v){v=v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055;return v*255}
function hexToOklch(hex){
  const{r,g,b}=hexToRgb(hex),R=srgbToLin(r),G=srgbToLin(g),B=srgbToLin(b);
  const l=Math.cbrt(.4122214708*R+.5363325363*G+.0514459929*B);
  const m=Math.cbrt(.2119034982*R+.6806995451*G+.1073969566*B);
  const s=Math.cbrt(.0883024619*R+.2817188376*G+.6299787005*B);
  const L=.2104542553*l+.7936177850*m-.0040720468*s;
  const a=1.9779984951*l-2.4285922050*m+.4505937099*s;
  const bb=.0259040371*l+.7827717662*m-.8086757660*s;
  return{L,C:Math.hypot(a,bb),H:((Math.atan2(bb,a)*180/Math.PI)+360)%360};
}
function oklchToRgbRaw(L,C,H){
  const a=C*Math.cos(H*Math.PI/180),b=C*Math.sin(H*Math.PI/180);
  const l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,s=(L-.0894841775*a-1.2914855480*b)**3;
  return[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.7076147010*s];
}
const inGamut=c=>c.every(v=>v>=-1e-4&&v<=1+1e-4);
// keep hue and lightness, reduce chroma until the colour exists on screen
function oklch(L,C,H){
  L=Math.max(0,Math.min(1,L));H=((H%360)+360)%360;
  let lo=0,hi=Math.max(0,C),rgb=oklchToRgbRaw(L,hi,H);
  if(!inGamut(rgb)){for(let i=0;i<22;i++){const mid=(lo+hi)/2;inGamut(oklchToRgbRaw(L,mid,H))?lo=mid:hi=mid}rgb=oklchToRgbRaw(L,lo,H)}
  return rgbToHex(...rgb.map(v=>linToSrgb(Math.max(0,Math.min(1,v)))));
}
function okDist(a,b){const A=hexToOklch(a),B=hexToOklch(b);
  const da=A.C*Math.cos(A.H*Math.PI/180)-B.C*Math.cos(B.H*Math.PI/180),db=A.C*Math.sin(A.H*Math.PI/180)-B.C*Math.sin(B.H*Math.PI/180);
  return Math.hypot(A.L-B.L,da,db);}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tuneL=(L,m)=>m.L==null?L:clamp(L*.45+m.L*.55,.4,.78);

// Four harmonies. Each returns 8 colours; the base colour always sits in slot 1.
// mood = how colourful the source is (from a photo, or the base itself) — partners never shout louder than it.
const HARMONIES={
  complementary:{name:'Complementary',rule:'Base + its opposite on the wheel · 180°',
    build(b,m){const h2=b.H+180,heroL=tuneL(clamp(b.L,.58,.76),m),pc=m.partnerC;
      return[
        oklch(.96,Math.min(.025,b.C*.15),b.H),          // paper
        null,                                           // base
        oklch(b.L*.78,b.C*.95,b.H),                     // base, deeper
        oklch(clamp(b.L*.52,.3,.48),b.C*.75,b.H),       // base, deep
        oklch(heroL,pc,h2),                             // opposite
        oklch(.42,pc*.85,h2),                           // opposite, deep
        oklch(.6,Math.min(.035,b.C*.25),b.H),           // neutral bridge
        oklch(.2,.025,h2)];}},                          // ink, tinted with the opposite
  triadic:{name:'Triadic',rule:'Three points spaced evenly · 120°',
    build(b,m){const h2=b.H+120,h3=b.H+240,heroL=tuneL(clamp(b.L,.6,.76),m),pc=m.partnerC;
      return[
        oklch(.96,Math.min(.025,b.C*.15),b.H),
        null,
        oklch(clamp(b.L*.55,.32,.5),b.C*.8,b.H),
        oklch(heroL,pc,h2),
        oklch(.44,pc*.85,h2),
        oklch(heroL-.04,pc,h3),
        oklch(.4,pc*.85,h3),
        oklch(.2,.025,b.H+180)];}},
  tetradic:{name:'Tetradic',rule:'Four points in a square · 90°',
    build(b,m){const heroL=tuneL(clamp(b.L,.6,.76),m),pc=m.partnerC*.92;
      return[
        oklch(.96,Math.min(.025,b.C*.15),b.H),
        null,
        oklch(heroL,pc,b.H+90),
        oklch(heroL-.04,pc,b.H+180),
        oklch(heroL-.02,pc,b.H+270),
        oklch(clamp(b.L*.55,.32,.5),b.C*.8,b.H),
        oklch(.4,pc*.8,b.H+180),
        oklch(.2,.025,b.H+180)];}},
  mono:{name:'Mono',rule:'One hue · only lightness and chroma change',
    build(b){
      const ladder=[.97,.88,.78,.68,.57,.46,.34,.21];
      // drop the rung closest to the base so the base takes its place
      let k=0;ladder.forEach((v,i)=>{if(Math.abs(v-b.L)<Math.abs(ladder[k]-b.L))k=i});
      return ladder.map((L,i)=>{
        if(i===k)return null;
        const t=Math.abs(L-.6)/.4;                       // chroma peaks in the mid-tones
        return oklch(L,b.C*(1-.75*t*t),b.H);
      });}},
};
let harmony='complementary';
let photo=null;   // {colors:[hex…], base:index, weights:[…]} from the last uploaded image
let photoActive=false;   // harmonies borrow the photo's mood while true

// How colourful the source is. From a photo: weighted average chroma, so a mostly-grey photo gives muted partners.
function moodOf(base){
  const b=hexToOklch(base);
  if(photo&&photoActive){
    let sum=0,w=0;photo.colors.forEach((c,i)=>{sum+=hexToOklch(c).C*photo.weights[i];w+=photo.weights[i]});
    const avg=w?sum/w:b.C;
    let sl=0;photo.colors.forEach((c,i)=>{sl+=hexToOklch(c).L*photo.weights[i]});
    return{partnerC:clamp(avg*.85,.035,b.C*.7),L:w?sl/w:null};
  }
  return{partnerC:b.C*.9,L:null};
}

function buildPalette(base){
  base=base.toUpperCase();
  const b=hexToOklch(base);
  let cols=HARMONIES[harmony].build(b,moodOf(base));
  // mono puts the base wherever its lightness falls; the others keep it in slot 1
  const bi=cols.indexOf(null);cols[bi]=base;
  // in photo mode, prefer a colour that really is in the photo when one sits close to the generated one
  if(photo&&photoActive){
    const used=new Set([base]);
    cols=cols.map((c,i)=>{
      if(i===bi)return c;
      let best=null,bd=.09;
      photo.colors.forEach(p=>{if(used.has(p))return;const d=okDist(c,p);if(d<bd){bd=d;best=p}});
      if(best){used.add(best);return best}
      return c;
    });
    if(harmony!=='mono'){
      const byL=[...photo.colors].sort((a,b)=>hexToOklch(b).L-hexToOklch(a).L);
      const light=byL[0],dark=byL[byL.length-1];
      if(hexToOklch(light).L>.82&&hexToOklch(light).C<.06&&!cols.includes(light))cols[0]=light;
      if(hexToOklch(dark).L<.36&&!cols.includes(dark))cols[7]=dark;
    }
  }
  return cols;
}

/* ---------- image extraction (k-means++) ---------- */
// Pull the real colours of a photo.
// Every swatch is a pixel colour that actually occurs in the image (no averaging),
// so flat brand colours come back exactly and photo noise does not invent muddy in-betweens.
function extract(img,k=8){
  const c=document.createElement('canvas'),sc=Math.min(1,320/Math.max(img.width,img.height));
  c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
  const x=c.getContext('2d');x.imageSmoothingEnabled=false;   // nearest-neighbour: no blended pixels
  x.drawImage(img,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height).data;
  // 1. group pixels into small colour boxes (32 levels per channel), remember the most common exact colour in each
  const boxes=new Map();let N=0;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<128)continue;N++;
    const key=(d[i]>>3)<<10|(d[i+1]>>3)<<5|(d[i+2]>>3),rgb=d[i]<<16|d[i+1]<<8|d[i+2];
    let bx=boxes.get(key);if(!bx){bx={n:0,cols:new Map()};boxes.set(key,bx)}
    bx.n++;bx.cols.set(rgb,(bx.cols.get(rgb)||0)+1);
  }
  const lab=hex=>{const o=hexToOklch(hex);return[o.L,o.C*Math.cos(o.H*Math.PI/180),o.C*Math.sin(o.H*Math.PI/180)]};
  const cand=[...boxes.values()].map(bx=>{
    let best=0,bn=-1;bx.cols.forEach((n,rgb)=>{if(n>bn){bn=n;best=rgb}});
    const hex=rgbToHex(best>>16&255,best>>8&255,best&255);
    return{hex,n:bx.n,lab:lab(hex)};
  }).sort((a,b)=>b.n-a.n);
  // 2. walk from the most common colour down; a colour joins the palette only if it is clearly different
  //    from those already picked, otherwise its pixels count towards the closest picked colour
  const T=.06,minShare=.006,picked=[];
  const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]);
  for(const cd of cand){
    let near=null,nd=1e9;for(const p of picked){const dd=dist(p.lab,cd.lab);if(dd<nd){nd=dd;near=p}}
    if(near&&nd<T){near.n+=cd.n;continue}
    if(picked.length<k&&cd.n/N>=minShare)picked.push({...cd});
    else if(near)near.n+=cd.n;
  }
  const tot=picked.reduce((a,p)=>a+p.n,0)||1;
  return picked.map(p=>({hex:p.hex,w:p.n/tot})).sort((a,b)=>hexToOklch(b.hex).L-hexToOklch(a.hex).L);
}

/* ---------- swatch interactions: click copies, double-click promotes to base ---------- */
function bindSwatch(el,getHex){
  let t=null;
  el.addEventListener('click',()=>{
    clearTimeout(t);
    t=setTimeout(()=>{const h=getHex();copy(h,'Copied '+h)},230);
  });
  el.addEventListener('dblclick',e=>{clearTimeout(t);promote(getHex(),e.clientX,e.clientY)});
}
function promote(hex,x,y){
  // show the Code field so the color has somewhere to land
  const codeTab=document.getElementById('tab-code');
  if(codeTab.getAttribute('aria-selected')!=='true')codeTab.click();
  const chip=document.querySelector('.code-field .chip').getBoundingClientRect();
  const dot=document.createElement('div');dot.className='flyer';dot.style.background=hex;
  const size=56;Object.assign(dot.style,{left:(x-size/2)+'px',top:(y-size/2)+'px',width:size+'px',height:size+'px'});
  document.body.appendChild(dot);
  if(reduceMotion){dot.remove();land(hex);return}
  const dx=chip.left+chip.width/2-x,dy=chip.top+chip.height/2-y,k=chip.width/size;
  dot.animate([
    {transform:'translate(0,0) scale(1)',opacity:1},
    {transform:`translate(${dx*.55}px,${dy*.62}px) scale(.8)`,opacity:1,offset:.6},
    {transform:`translate(${dx}px,${dy}px) scale(${k})`,opacity:1}
  ],{duration:620,easing:'cubic-bezier(.6,0,.2,1)'}).onfinish=()=>{dot.remove();land(hex)};
}
function land(hex){
  fromBase(hex);
  const f=document.querySelector('.code-field');f.classList.remove('landed');void f.offsetWidth;f.classList.add('landed');
  toast(hex+' is the new base');
}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- render ---------- */
const stage=document.getElementById('stage');
let palette=[],baseHex='#EBC05A',baseIndex=-1;

function render(colors,bIdx){
  palette=colors;baseIndex=bIdx;
  const fresh=stage.children.length!==colors.length;
  if(fresh){stage.innerHTML='';colors.forEach((_,i)=>{
    const p=document.createElement('div');p.className='pill';p.tabIndex=0;p.setAttribute('role','button');
    p.style.zIndex=colors.length-i;p.style.animationDelay=(i*70)+'ms';
    p.innerHTML='<div class="label"></div>';
    p.title='Click to copy · Double-click to use as base';
    bindSwatch(p,()=>palette[i]);
    p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();p.click()}});
    stage.appendChild(p);
  })}
  colors.forEach((hex,i)=>{
    const p=stage.children[i],lab=p.firstChild,{r,g,b}=hexToRgb(hex),info=describe(hex);
    p.style.backgroundColor=hex;p.setAttribute('aria-label',hex+' '+info.name+', copy');
    lab.style.color=luminance(hex)>.42?'rgba(20,14,10,.82)':'rgba(255,250,244,.92)';
    lab.innerHTML=(i===bIdx?'<span class="base">base</span>':'')+
      '<span class="hex">'+hex+'</span>'+
      '<span>RGB '+r+' '+g+' '+b+'</span>'+
      (info.pantone?'<span class="name">'+info.pantone+'</span>':'')+
      '<span class="name">'+info.name+'</span>';
  });
  theme(colors);layout();cvSync();
}

function theme(colors){
  const root=document.documentElement.style,b=hexToHSL(baseHex);
  root.setProperty('--h',Math.round(b.h));
  root.setProperty('--accent',baseHex);
  root.setProperty('--accent-ink',luminance(baseHex)>.42?'#1a1410':'#fffaf4');
  root.setProperty('--brand-l',hslToHex(b.h,Math.min(b.s,70),30));root.setProperty('--brand-d',hslToHex(b.h,Math.min(b.s,70),72));
}

const M={pw:0,step:0,G:0,off:0,vertical:false};
function layout(){
  const W=stage.clientWidth,n=stage.children.length;if(!n)return;
  const vertical=W<640;stage.classList.toggle('vertical',vertical);M.vertical=vertical;
  if(!vertical){
    const r=.7,gr=.3,pw=W/(1+(n-1)*r+gr*r),step=pw*r,G=step*gr,ph=Math.min(pw*2.9,600);
    Object.assign(M,{pw,step,G,off:G/2});
    stage.style.height=ph+'px';
    [...stage.children].forEach((p,i)=>{
      Object.assign(p.style,{left:(G/2+i*step)+'px',top:'0px',width:pw+'px',height:ph+'px'});
      const lab=p.firstChild,x0=i===0?pw*.14:pw-step+step*.1;
      Object.assign(lab.style,{left:x0+'px',width:(i===0?pw*.72:step*.82)+'px',bottom:pw*.5+'px',top:'auto'});
    });
  }else{
    const ph=104,step=66,G=18,H=ph+step*(n-1)+G;
    Object.assign(M,{pw:ph,step,G,off:G/2});
    stage.style.height=H+'px';
    [...stage.children].forEach((p,i)=>{
      Object.assign(p.style,{left:'0px',top:(G/2+i*step)+'px',width:W+'px',height:ph+'px'});
      const lab=p.firstChild,y0=i===0?18:ph-step+12;
      Object.assign(lab.style,{left:ph*.45+'px',width:(W-ph*.9)+'px',top:y0+'px',bottom:'auto'});
    });
  }
}

/* ---------- reference weights: circles sized by share of the photo, floating ---------- */
let lastWeights=null;
function showWeights(url,ex){
  lastWeights=ex;
  document.getElementById('refImg').style.backgroundImage='url('+url+')';
  document.getElementById('weights').hidden=false;
  placeOrbs();
}
function placeOrbs(){
  if(!lastWeights)return;
  const field=document.getElementById('field');field.innerHTML='';
  const W=field.clientWidth,H=field.clientHeight;
  const items=[...lastWeights].sort((a,b)=>b.w-a.w);
  // area ∝ weight; scale so circles cover ~30% of the field
  const totalW=items.reduce((a,b)=>a+b.w,0);
  const K=Math.sqrt(W*H*.3/(Math.PI*totalW));
  const minR=34;   // smallest circle still fits % and HEX inside
  const orbs=items.map((it,i)=>{
    const r=Math.max(minR,Math.sqrt(it.w)*K);
    // seeded start: spiral around the centre, biggest in the middle
    const a=i*2.4,d=i===0?0:Math.min(W,H)*.12*Math.sqrt(i);
    return{...it,r,x:W/2+Math.cos(a)*d*1.6,y:H/2+Math.sin(a)*d*.8};
  });
  const gap=16;
  for(let it=0;it<400;it++){
    for(let i=0;i<orbs.length;i++)for(let j=i+1;j<orbs.length;j++){
      const A=orbs[i],B=orbs[j];let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||.01;
      const min=A.r+B.r+gap;
      if(d<min){const push=(min-d)/2;dx/=d;dy/=d;A.x-=dx*push;A.y-=dy*push;B.x+=dx*push;B.y+=dy*push}
    }
    for(const o of orbs){
      o.x+=(W/2-o.x)*.004;o.y+=(H/2-o.y)*.01;
      o.x=Math.max(o.r+4,Math.min(W-o.r-4,o.x));o.y=Math.max(o.r+10,Math.min(H-o.r-10,o.y));
    }
  }
  orbs.forEach((o,i)=>{
    const el=document.createElement('div');el.className='orb';el.tabIndex=0;el.setAttribute('role','button');
    el.title='Click to copy · Double-click to use as base';
    el.setAttribute('aria-label',o.hex+', '+Math.round(o.w*100)+' percent of the photo');
    Object.assign(el.style,{left:(o.x-o.r)+'px',top:(o.y-o.r)+'px',width:o.r*2+'px',height:o.r*2+'px',background:o.hex});
    el.style.setProperty('--dur',(5.5+((i*1.7)%3.5)).toFixed(2)+'s');
    el.style.setProperty('--delay',(-(i*1.3)%5).toFixed(2)+'s');
    el.style.setProperty('--amp',(5+o.r*.06).toFixed(1)+'px');
    el.style.setProperty('--sway',((i%2?1:-1)*(2+i%3)).toFixed(0)+'px');
    const pct=o.w*100;
    const ink=luminance(o.hex)>.42?'rgba(20,14,10,.85)':'rgba(255,250,244,.94)';
    const big=Math.max(13,Math.min(30,o.r*.3));
    el.innerHTML='<span class="orb-tag" style="color:'+ink+'"><b style="font-size:'+big.toFixed(1)+'px">'+(pct<1?pct.toFixed(1):Math.round(pct))+'%</b><span>'+o.hex+'</span></span>';
    bindSwatch(el,()=>o.hex);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();copy(o.hex,'Copied '+o.hex)}});
    field.appendChild(el);
  });
}

/* ---------- motion: index-card accordion — the stack parts on its own axis ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let pointer=null,active=-1;const cur=[];
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();pointer={x:e.clientX-r.left,y:e.clientY-r.top}});
stage.addEventListener('pointerleave',()=>{pointer=null});
const ease=.2;
function tick(){
  const pills=[...stage.children],n=pills.length;
  if(n&&M.step){
    // which capsule's visible strip is under the cursor
    let idx=-1;
    if(pointer){
      const pos=(M.vertical?pointer.y:pointer.x)-M.off;
      // strip of capsule 0 is [0,pw); capsule i>0 owns [pw+(i-1)step, pw+i*step)
      idx=pos<M.pw?0:Math.min(n-1,Math.floor((pos-M.pw)/M.step)+1);
      if(pos<-M.off||pos>M.pw+(n-1)*M.step+M.off)idx=-1;
    }
    if(idx!==active){
      active=idx;
      stage.classList.toggle('focusing',idx>=0);
      pills.forEach((p,i)=>{p.classList.toggle('on',i===idx);p.style.zIndex=i===idx?100:n-i});
    }
    pills.forEach((p,i)=>{
      // capsules before the active one slide back, the active one and after slide forward
      const target=(idx<0||reduce)?0:(i<idx?-M.G/2:M.G/2);
      const sc=(idx===i&&!reduce)?1.07:1;
      const t=cur[i]||(cur[i]={v:0,s:1});
      t.v+=(target-t.v)*ease;t.s+=(sc-t.s)*ease;
      p.style.transform=(M.vertical?`translateY(${t.v.toFixed(2)}px)`:`translateX(${t.v.toFixed(2)}px)`)+` scale(${t.s.toFixed(4)})`;
    });
  }
  requestAnimationFrame(tick);
}

/* ---------- canvas: a Bauhaus test sheet — up to 4 chosen colors at work on paper ---------- */
// Two styles: Circular (capsules, circles and dots on a square module) and Construct (a band, a sun, a diagonal,
// a bar and a rule). A layout depends only on the seed, style, format, number of colors and ink,
// so editing a HEX, switching paper or typing text recolors the same poster. Shuffle draws a new one.
const CV_MOD={'3:4':[4,5],'1:1':[4,4],'9:16':[4,7],'16:9':[7,4]};    // Circular: square cells
const CV_PAPER={cream:'#F3EDE2',white:'#FFFFFF'},CV_INK='#1D1B1A';
const CV_FONTS=[   // [family, weight, Google Fonts query — null when the page already loads it]
  ['Syne',800,null],['Inter',800,'Inter:wght@800'],['Space Grotesk',700,'Space+Grotesk:wght@700'],
  ['Archivo Black',400,'Archivo+Black'],['Bebas Neue',400,'Bebas+Neue'],['Unbounded',700,'Unbounded:wght@700'],
  ['DM Serif Display',400,'DM+Serif+Display'],['Playfair Display',800,'Playfair+Display:wght@800'],['Space Mono',700,null]];
const cv={sel:[],auto:true,style:'circular',paper:'cream',ink:true,format:'3:4',seed:11,text:'',font:0,tc:-2,place:'band',L:null,svg:''};
const cvArt=document.getElementById('cvArt'),cvChips=document.getElementById('cvChips'),
  cvRows=document.getElementById('cvRows'),cvTC=document.getElementById('cvTextColor'),cvFontSel=document.getElementById('cvFont');
const cvN=v=>Math.round(v*10)/10;
const cvEsc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function cvRng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function cvPick(R,items){let s=0;items.forEach(i=>s+=i[1]);let r=R()*s;for(const i of items){if((r-=i[1])<0)return i[0]}return items[items.length-1][0]}
// color roles inside a layout: -1 paper, -2 ink, 0..3 the chosen colors; weights say how often each one is drawn
function cvRoles(n,{paper=0,ink=1,colors=3}={}){const a=[];if(paper)a.push([-1,paper]);if(cv.ink&&ink)a.push([-2,ink]);for(let i=0;i<n;i++)a.push([i,colors/n]);return a}
// a shape whose color is nearly its ground's would vanish: swap in the most contrasting color on the sheet
function cvPair(bg,fg){
  if(okDist(bg,fg)>=.06)return fg;
  return[...(cv.ink?[CV_INK]:[]),CV_PAPER[cv.paper],...cv.sel.map(s=>s.hex)].reduce((b,h)=>okDist(bg,h)>okDist(bg,b)?h:b);
}

function cvLayout(){
  const R=cvRng(cv.seed),n=cv.sel.length;
  const L=cv.style==='construct'?cvConstruct(R,n):cvCircular(R,n);
  L.frame=cv.style==='circular'||R()<.7;L.n=n;   // Construct is sometimes full-bleed, its forms cut by the edge
  return L;
}

/* Circular: tile a square module with capsules (2–3 cells, some with dots at the ends), big discs (some with an eye),
   dots, squares with a hole, quarter discs and a little air */
function cvCircular(R,n){
  const[cols,rows]=CV_MOD[cv.format],used=[...Array(rows)].map(()=>Array(cols).fill(false));
  const free=(c,r,w,h)=>{if(c+w>cols||r+h>rows)return false;for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)if(used[y][x])return false;return true};
  const items=[],main=cvRoles(n,{ink:1.4,colors:3.2});
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(used[r][c])continue;
    const opts=[[['dot',1,1],1.4],[['hole',1,1],.7],[['quarter',1,1],.8],[['none',1,1],1.1]];
    if(free(c,r,2,2))opts.push([['disc',2,2],2.4]);
    for(const l of[2,3]){if(free(c,r,l,1))opts.push([['pill',l,1],l===2?1.9:1.6]);if(free(c,r,1,l))opts.push([['pill',1,l],l===2?1.9:1.6])}
    const[t,w,h]=cvPick(R,opts);
    for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)used[y][x]=true;
    const it={t,c,r,w,h,dir:Math.floor(R()*4),k:R(),role:cvPick(R,main)};
    it.accOn=t==='hole'||(t==='disc'&&it.k<.45)||(t==='pill'&&it.k<.6);
    it.acc=cvPick(R,cvRoles(n,{paper:1.6,ink:1,colors:2}).filter(x=>x[0]!==it.role));
    items.push(it);
  }
  // every chosen color shows up at least once
  const live=items.filter(it=>it.t!=='none');
  const uses=v=>live.filter(it=>it.role===v||(it.accOn&&it.acc===v)).length;
  for(let i=0;i<n;i++){
    if(uses(i))continue;
    let pool=live.filter(it=>it.role<0||uses(it.role)>1);
    if(pool.length){const it=pool[Math.floor(R()*pool.length)];it.role=i;if(it.acc===i)it.acc=-1;continue}
    pool=items.filter(it=>it.t==='none');
    if(pool.length){const it=pool[Math.floor(R()*pool.length)];Object.assign(it,{t:'dot',role:i,accOn:false});live.push(it);continue}
    pool=live.filter(it=>it.accOn&&it.role!==i&&(it.acc<0||uses(it.acc)>1));
    if(pool.length)pool[Math.floor(R()*pool.length)].acc=i;
  }
  return{kind:'cells',cols,rows,items};
}

/* Construct: few big forms and a lot of air — a band, a sun on its edge or a half sun on the floor,
   a leaning slab, a bar, a thin rule, a dot and a square. Positions are fractions of the art area. */
function cvConstruct(R,n){
  const els=[],bs=.24+R()*.14,add=(t,o)=>els.push({t,...o});
  add('band',{s:bs});
  if(R()<.45)add('halfsun',{x:.2+R()*.3,r:.3+R()*.12});else add('sun',{x:.2+R()*.3,y:bs,r:.2+R()*.1});
  if(R()<.85)add('slab',{x:.45+R()*.2,w:.1+R()*.07,lean:(R()<.5?-1:1)*(.16+R()*.2)});
  if(R()<.75)add('bar',{w:.16+R()*.08,h:.34+R()*.28});
  if(R()<.7)add('rule',{y:bs+.03+R()*.05});
  if(R()<.8)add('dot',{x:.72+R()*.16,y:bs*.5,r:.05+R()*.04});
  if(R()<.45)add('sq',{x:.06+R()*.08,y:bs+.12+R()*.1,s:.09+R()*.05});
  while(els.filter(e=>e.t!=='rule').length<n)add('sq',{x:.08+R()*.6,y:.55+R()*.3,s:.08+R()*.05});
  // colors go to the big forms first, in a seeded order; the rest get ink or a color, never the color they sit on
  const big=els.filter(e=>e.t!=='rule');
  for(let i=big.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[big[i],big[j]]=[big[j],big[i]]}
  big.slice(0,n).forEach((e,i)=>e.role=i);
  const touches={band:['sun','slab','dot','rule'],sun:['band','slab'],halfsun:['slab','bar'],slab:['band','sun','halfsun','bar','rule'],
    bar:['slab','halfsun','rule'],rule:['band','slab','bar'],dot:['band'],sq:['rule']};
  els.forEach(e=>{
    if(e.role!=null)return;
    const taken=new Set(els.filter(o=>touches[e.t].includes(o.t)&&o.role!=null).map(o=>o.role));
    const cand=[...(cv.ink?[-2]:[]),...Array.from({length:n},(_,i)=>i)].filter(v=>!taken.has(v));
    e.role=e.t==='rule'&&cv.ink&&!taken.has(-2)?-2:cand.length?cand[Math.floor(R()*cand.length)]:-1;
  });
  return{kind:'free',els,fx:R()<.5,fy:R()<.5};
}

function cvDrawCells(L,A,col){
  const u=Math.min(A.w/L.cols,A.h/L.rows),ox=A.x+(A.w-u*L.cols)/2,oy=A.y+(A.h-u*L.rows)/2,g=u*.06,N=cvN;
  const disc=(cx,cy,r,f)=>`<circle cx="${N(cx)}" cy="${N(cy)}" r="${N(r)}" fill="${f}"/>`;
  let art='';
  L.items.forEach((it,i)=>{
    if(it.t==='none')return;
    const x=ox+it.c*u,y=oy+it.r*u,w=it.w*u,h=it.h*u,f=col(it.role),a=cvPair(f,col(it.acc));let s='';
    switch(it.t){
      case 'disc':s=disc(x+u,y+u,u-g,f)+(it.accOn?disc(x+u,y+u,u*.42,a):'');break;
      case 'dot':s=disc(x+u/2,y+u/2,u/2-g,f);break;
      case 'hole':s=`<rect x="${N(x+g)}" y="${N(y+g)}" width="${N(u-2*g)}" height="${N(u-2*g)}" fill="${f}"/>`+disc(x+u/2,y+u/2,u*.27,a);break;
      case 'quarter':{const sx=it.dir&1?-1:1,sy=it.dir&2?-1:1,R=u-2*g,ax=x+g+(sx<0?R:0),ay=y+g+(sy<0?R:0);
        s=`<path d="M${N(ax)},${N(ay)}L${N(ax+sx*R)},${N(ay)}A${N(R)},${N(R)} 0 0 ${sx*sy>0?1:0} ${N(ax)},${N(ay+sy*R)}Z" fill="${f}"/>`;break}
      case 'pill':{const pw=w-2*g,ph=h-2*g,r=Math.min(pw,ph)/2,hor=it.w>it.h;
        s=`<rect x="${N(x+g)}" y="${N(y+g)}" width="${N(pw)}" height="${N(ph)}" rx="${N(r)}" fill="${f}"/>`;
        if(it.accOn)(it.k<.3?[0,1]:[it.dir&1]).forEach(e=>{
          s+=disc(hor?(e?x+w-u/2:x+u/2):x+u/2,hor?y+u/2:(e?y+h-u/2:y+u/2),r*.62,a)});
        break}
    }
    art+=`<g id="Shape ${i+1}">${s}</g>`;
  });
  return{defs:'',art:`<g id="Shapes">${art}</g>`};
}

const CV_NAMES={band:'Band',sun:'Sun',halfsun:'Half sun',slab:'Diagonal',bar:'Bar',rule:'Rule',dot:'Dot',sq:'Square'};
function cvDrawFree(L,A,col,cid){
  const S=Math.min(A.w,A.h),N=cvN,X=v=>A.x+(L.fx?1-v:v)*A.w,Y=v=>A.y+(L.fy?1-v:v)*A.h;
  const rect=(x1,y1,x2,y2,f)=>{const a=X(x1),b=X(x2),c=Y(y1),d=Y(y2);
    return `<rect x="${N(Math.min(a,b))}" y="${N(Math.min(c,d))}" width="${N(Math.abs(b-a))}" height="${N(Math.abs(d-c))}" fill="${f}"/>`};
  const disc=(cx,cy,r,f)=>`<circle cx="${N(cx)}" cy="${N(cy)}" r="${N(r)}" fill="${f}"/>`;
  const band=L.els.find(e=>e.t==='band'),bandHex=col(band?band.role:-1);
  let art='';
  L.els.forEach(e=>{
    const f=e.t==='sun'||e.t==='dot'?cvPair(bandHex,col(e.role)):col(e.role);let s='';
    switch(e.t){
      case 'band':s=rect(0,0,1,e.s,f);break;
      case 'sun':s=disc(X(e.x),Y(e.y),e.r*S,f);break;
      case 'halfsun':s=disc(X(e.x),Y(1),e.r*S,f);break;
      case 'slab':{const p=[[e.x-e.w/2+e.lean/2,0],[e.x+e.w/2+e.lean/2,0],[e.x+e.w/2-e.lean/2,1],[e.x-e.w/2-e.lean/2,1]];
        s=`<polygon points="${p.map(q=>N(X(q[0]))+','+N(Y(q[1]))).join(' ')}" fill="${f}"/>`;break}
      case 'bar':s=rect(1-e.w,1-e.h,1,1,f);break;
      case 'rule':s=rect(0,e.y,1,e.y+Math.max(3,A.h*.008)/A.h,f);break;
      case 'dot':s=disc(X(e.x),Y(e.y),e.r*S,f);break;
      case 'sq':s=rect(e.x,e.y,e.x+e.s*S/A.w,e.y+e.s*S/A.h,f);break;
    }
    art+=`<g id="${CV_NAMES[e.t]}">${s}</g>`;
  });
  return{defs:`<clipPath id="${cid}art"><rect x="${A.x}" y="${A.y}" width="${A.w}" height="${A.h}"/></clipPath>`,
    art:`<g id="Shapes" clip-path="url(#${cid}art)">${art}</g>`};
}

const cvCtx=document.createElement('canvas').getContext('2d');
function cvDraw(){
  const L=cv.L;if(!L)return;
  const[a,b]=cv.format.split(':').map(Number),W=1200,H=Math.round(W*b/a),S=Math.min(W,H);
  const col=v=>v===-1?CV_PAPER[cv.paper]:v===-2?CV_INK:(cv.sel[v]||{hex:CV_INK}).hex;
  const text=cv.text.trim(),band=!!text&&cv.place==='band';
  const m=L.frame?Math.round(S*.06):0,pad=Math.round(S*.06),bandH=band?Math.round(S*(W>H?.2:.17)):0;
  const A={x:m,y:m,w:W-2*m,h:H-2*m-bandH};   // the art area, above the text band
  const cid='cv'+cv.seed.toString(36)+'-';   // clip ids unique per poster
  const{defs,art}=(L.kind==='free'?cvDrawFree:cvDrawCells)(L,A,col,cid);
  let txt='';
  if(text){
    const[fam,wt]=CV_FONTS[cv.font];
    cvCtx.font=`${wt} 100px "${fam}"`;
    const per=cvCtx.measureText(text).width/100||.6*text.length,left=band?Math.max(m,pad):m+pad,maxW=W-2*left;
    let fs=band?bandH*.52:S*.15;if(per*fs>maxW)fs=maxW/per;
    const base=band?H-m-bandH/2+fs*.34:H-m-pad;
    txt=`<text id="Text" x="${left}" y="${cvN(base)}" font-family="'${cvEsc(fam)}', sans-serif" font-weight="${wt}" font-size="${cvN(fs)}" fill="${col(cv.tc)}">${cvEsc(text)}</text>`;
  }
  cv.svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs>${defs}</defs>`+
    `<g id="C3 Canvas · ${cv.style} · ${cv.format}"><rect id="Paper" width="${W}" height="${H}" fill="${col(-1)}"/>${art}${txt}</g></svg>`;
  cvArt.innerHTML=cv.svg;cvSize();
}
function cvSize(){
  const svg=cvArt.firstElementChild;if(!svg)return;
  const W=+svg.getAttribute('width'),H=+svg.getAttribute('height'),avail=cvArt.clientWidth,maxH=Math.min(innerHeight*.8,880);
  let w=avail,h=avail*H/W;if(h>maxH){h=maxH;w=h*W/H}
  svg.style.width=w+'px';svg.style.height=h+'px';
}
addEventListener('resize',()=>{clearTimeout(window.__cv);window.__cv=setTimeout(cvSize,120)});

// which palette colors go on the canvas: the base plus the ones most different from it,
// skipping paper-like and ink-like colors (paper and ink are already on the sheet)
function cvAutoPick(){
  const o=palette.map(h=>hexToOklch(h));
  let cand=palette.map((_,i)=>i).filter(i=>o[i].L<.92&&o[i].L>.22&&okDist(palette[i],CV_PAPER.cream)>.06);
  if(cand.length<2)cand=palette.map((_,i)=>i);
  const out=[cand.includes(baseIndex)?baseIndex:cand[0]];
  while(out.length<Math.min(3,cand.length)){
    let best=-1,bd=-1;
    for(const i of cand){if(out.includes(i))continue;const d=Math.min(...out.map(j=>okDist(palette[i],palette[j])));if(d>bd){bd=d;best=i}}
    out.push(best);
  }
  return out.map(i=>({idx:i,hex:palette[i]}));
}
// called from render(): colors picked from the palette follow it, typed ones stay
function cvSync(){
  if(cv.auto)cv.sel=cvAutoPick();
  else{cv.sel=cv.sel.filter(s=>s.idx==null||s.idx<palette.length);cv.sel.forEach(s=>{if(s.idx!=null)s.hex=palette[s.idx]});if(!cv.sel.length)cv.sel=cvAutoPick()}
  if(cv.tc>=cv.sel.length)cv.tc=-2;
  if(!cv.L||cv.L.n!==cv.sel.length)cv.L=cvLayout();
  cvPanel();cvDraw();
}
function cvRelayout(){if(cv.tc>=cv.sel.length)cv.tc=-2;cv.L=cvLayout();cvPanel();cvDraw()}
function cvToggle(i){
  const k=cv.sel.findIndex(s=>s.idx===i);
  if(k>=0){if(cv.sel.length<2)return toast('Keep at least one color');cv.sel.splice(k,1)}
  else{if(cv.sel.length>=4)return toast('Up to 4 colors on the canvas');cv.sel.push({idx:i,hex:palette[i]})}
  cv.auto=false;cvRelayout();
}
function cvMarkChips(){[...cvChips.children].forEach((b,i)=>b.setAttribute('aria-pressed',cv.sel.some(s=>s.idx===i)))}
function cvPanel(){
  cvChips.innerHTML='';
  palette.forEach((hex,i)=>{
    const b=document.createElement('button');b.type='button';b.className='cv-chip';b.style.background=hex;b.title=hex;
    b.setAttribute('aria-label',hex+' '+describe(hex).name);b.addEventListener('click',()=>cvToggle(i));cvChips.appendChild(b);
  });
  cvMarkChips();
  cvRows.innerHTML='';
  cv.sel.forEach((s,k)=>{
    const row=document.createElement('div');row.className='cv-row';
    row.innerHTML=`<span class="cv-sw" style="background:${s.hex}"></span><span class="cv-hash">#</span>`+
      `<input class="cv-hex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Color ${k+1}, HEX" value="${s.hex.slice(1)}">`+
      `<button type="button" class="cv-x" aria-label="Remove color ${k+1}" title="Remove">×</button>`;
    const inp=row.querySelector('.cv-hex'),sw=row.firstChild;
    const apply=()=>{const v=inp.value.replace(/[^0-9a-f]/gi,'');
      const hex=v.length===3?'#'+v.split('').map(c=>c+c).join(''):v.length===6?'#'+v:null;if(!hex)return false;
      if(hex.toUpperCase()===s.hex)return true;
      s.hex=hex.toUpperCase();s.idx=null;cv.auto=false;sw.style.background=s.hex;cvMarkChips();cvTextChips();cvDraw();return true};
    inp.addEventListener('input',()=>{if(inp.value.replace(/[^0-9a-f]/gi,'').length===6)apply()});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!apply())toast('Enter 3 or 6 HEX digits')});
    inp.addEventListener('blur',()=>{apply();inp.value=s.hex.slice(1)});
    row.querySelector('.cv-x').addEventListener('click',()=>{
      if(cv.sel.length<2)return toast('Keep at least one color');cv.sel.splice(k,1);cv.auto=false;cvRelayout()});
    cvRows.appendChild(row);
  });
  cvTextChips();
}
function cvTextChips(){
  cvTC.innerHTML='';
  [[-2,CV_INK,'Ink'],[-1,CV_PAPER[cv.paper],'Paper'],...cv.sel.map((s,k)=>[k,s.hex,s.hex])].forEach(([v,hex,name])=>{
    const b=document.createElement('button');b.type='button';b.className='cv-chip sm';b.style.background=hex;b.title='Text · '+name;
    b.setAttribute('aria-label','Text color '+name);b.setAttribute('aria-pressed',cv.tc===v);
    b.addEventListener('click',()=>{cv.tc=v;cvTextChips();cvDraw()});cvTC.appendChild(b);
  });
}
function cvSeg(id,attr,after){
  const el=document.getElementById(id);
  el.addEventListener('click',e=>{const b=e.target.closest('[data-'+attr+']');if(!b)return;
    cv[attr==='f'?'format':attr]=b.dataset[attr];el.querySelectorAll('[data-'+attr+']').forEach(x=>x.setAttribute('aria-pressed',x===b));after()});
}
cvSeg('cvStyle','style',()=>{cv.L=cvLayout();cvDraw()});
cvSeg('cvPaper','paper',()=>{cvTextChips();cvDraw()});
cvSeg('cvFormat','f',()=>{cv.L=cvLayout();cvDraw()});
cvSeg('cvPlace','place',cvDraw);
const cvInkBtn=document.getElementById('cvInk');
cvInkBtn.addEventListener('click',()=>{cv.ink=!cv.ink;cvInkBtn.setAttribute('aria-pressed',cv.ink);cv.L=cvLayout();cvDraw()});
document.getElementById('cvText').addEventListener('input',e=>{cv.text=e.target.value;cvDraw()});
document.getElementById('cvShuffle').addEventListener('click',()=>{cv.seed=Math.floor(Math.random()*1e9);cv.L=cvLayout();cvDraw()});
document.getElementById('cvCopy').addEventListener('click',()=>copy(cv.svg,'Canvas SVG copied. Paste into Figma with Cmd+V'));
// fonts beyond Syne and Space Mono load from Google Fonts only when picked
const cvFontsReady=new Set(['Syne','Space Mono']);
CV_FONTS.forEach(([fam],i)=>{const o=document.createElement('option');o.value=i;o.textContent=fam;cvFontSel.appendChild(o)});
cvFontSel.addEventListener('change',()=>{
  cv.font=+cvFontSel.value;const[fam,wt,q]=CV_FONTS[cv.font];
  if(!cvFontsReady.has(fam)){cvFontsReady.add(fam);
    const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+q+'&display=swap';
    l.onload=()=>document.fonts.load(`${wt} 100px "${fam}"`).then(cvDraw,cvDraw);document.head.appendChild(l)}
  cvDraw();
});
document.fonts.ready.then(cvDraw);

// show focus rings only after the keyboard is used
addEventListener('keydown',e=>{if(e.key==='Tab')document.body.classList.add('kbd')});
addEventListener('pointerdown',()=>document.body.classList.remove('kbd'));

fromBase('#EBC05A');
</script>
